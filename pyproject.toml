[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "toy-vo"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = [
  "version",
  "description",
  "readme",
  "urls",
  "license",
  "keywords",
]
dependencies = ["numpy"]

[tool.maturin]
module-name = "toy_vo"
features = ["python"]
python-source = "python"
