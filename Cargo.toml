sqpnp_simple = "0.2.0"
tiny-solver = "0.18.0"

[dev-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
fastrand = "2.4.1"
glob = "0.3.3"
rerun = "0.32"
